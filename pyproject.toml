[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberautopsy"
version = "0.1.0"
description = "Cyber Autopsy — a real-world cyberattack reconstruction benchmark. Can AI reconstruct what actually happened during a real cyberattack?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Cyber Autopsy contributors" }]
dependencies = [
    "pydantic>=2.5",
    "networkx>=3.1",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
kaggle = ["kaggle-benchmarks>=0.6", "kaggle>=1.7"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
